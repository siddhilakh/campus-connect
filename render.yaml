services:
  - type: web
    name: campusconnect-backend
    env: node
    plan: free
    buildCommand: "cd server && npm install && npm run build"
    startCommand: "cd server && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
